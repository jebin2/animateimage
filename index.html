<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimateImage</title>
  <meta name="description" content="Animate a photo into a short looping video, or edit it, with your own Gemini API key. Runs in your browser.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'sans-serif'],
            display: ['Quicksand', 'sans-serif'],
          },
          colors: {
            cute: {
              pink: '#FFD1DC',
              purple: '#E0BBE4',
              blue: '#D4F0F0',
              yellow: '#FDFD96',
              text: '#4A4A4A',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .font-display {
      font-family: 'Quicksand', sans-serif;
    }

    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #fdf2f8;
    }

    ::-webkit-scrollbar-thumb {
      background: #f9a8d4;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #f472b6;
    }
  </style>
</head>

<body
  class="bg-gradient-to-br from-pink-50 via-white to-purple-50 text-slate-700 antialiased selection:bg-pink-200 selection:text-pink-900 min-h-screen">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
